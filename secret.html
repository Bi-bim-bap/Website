<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>???</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            background: #080808;

            color: #f5f5f5;

            font-family:
                monospace;

            display: flex;

            justify-content: center;

            align-items: center;

            overflow: hidden;

        }


        /* =================================
           BACKGROUND
        ================================= */

        .background {

            position: fixed;

            inset: 0;

            background:

                radial-gradient(
                    circle at center,
                    #242424 0%,
                    #080808 65%
                );

            z-index: -2;

        }


        /* =================================
           CONTAINER
        ================================= */

        .secret {

            width: 90%;

            max-width: 800px;

            text-align: center;

            padding: 60px;

            border: 1px solid #444;

            background: rgba(10,10,10,0.8);

            box-shadow:
                0 0 60px rgba(255,255,255,0.05);

        }


        .warning {

            color: #777;

            font-size: 12px;

            letter-spacing: 4px;

            margin-bottom: 30px;

        }


        h1 {

            font-size:
                clamp(45px, 8vw, 90px);

            margin-bottom: 20px;

            letter-spacing: -4px;

        }


        .glitch {

            animation:
                glitch 2s infinite;

        }


        @keyframes glitch {

            0% {
                transform: translate(0);
            }

            92% {
                transform: translate(0);
            }

            94% {
                transform: translate(3px, -2px);
            }

            96% {
                transform: translate(-3px, 2px);
            }

            98% {
                transform: translate(2px, 1px);
            }

            100% {
                transform: translate(0);
            }

        }


        .message {

            max-width: 550px;

            margin: 0 auto;

            color: #aaa;

            line-height: 1.8;

        }


        /* =================================
           RANDOM FACT
        ================================= */

        .fact {

            margin-top: 40px;

            padding: 20px;

            border: 1px dashed #444;

            color: #ccc;

        }


        .fact-title {

            color: #666;

            font-size: 11px;

            letter-spacing: 3px;

            margin-bottom: 10px;

        }


        /* =================================
           BUTTON
        ================================= */

        button {

            margin-top: 35px;

            padding: 12px 25px;

            background: transparent;

            color: white;

            border: 1px solid #555;

            cursor: pointer;

            font-family: monospace;

            transition: 0.3s;

        }


        button:hover {

            background: white;

            color: black;

        }


        /* =================================
           SECRET CODE
        ================================= */

        .code {

            position: fixed;

            bottom: 20px;

            right: 25px;

            font-size: 10px;

            color: #333;

        }

    </style>

</head>


<body>


    <div class="background"></div>


    <main class="secret">


        <div class="warning">

            YOU FOUND SOMETHING

        </div>


        <h1 class="glitch">

            SECRET MODE

        </h1>


        <p class="message">

            You weren't really supposed to find this.

            <br><br>

            This is the part of the website where
            the professional engineering student
            disappears and the actual human being
            takes over.

        </p>


        <div class="fact">

            <div class="fact-title">

                CLASSIFIED INFORMATION

            </div>

            <p id="fact">

                Loading classified information...

            </p>

        </div>


        <button onclick="newFact()">

            Reveal another secret

        </button>


    </main>


    <div class="code">

        FILE: LL-SECRET-001

    </div>



    <script>

        const facts = [

            "I once spent more time debugging a project than building it.",

            "There is definitely a project somewhere that technically works.",

            "I probably have too many tabs open right now.",

            "This page has absolutely no academic purpose.",

            "I have started a project just because I thought the idea was cool.",

            "Some of my best ideas probably happened at completely inappropriate times.",

            "You have now spent more time on this website than expected.",

            "This information is classified."

        ];


        function newFact() {

            const randomIndex =
                Math.floor(
                    Math.random() * facts.length
                );

            document.getElementById("fact")
                .textContent =
                facts[randomIndex];

        }


        newFact();

    </script>


</body>

</html>
